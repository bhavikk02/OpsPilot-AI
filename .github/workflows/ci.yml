name: OpsPilot AI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build knowledge base
        run: |
          python scripts/ingest.py

      - name: Start FastAPI
        run: |
          echo "Starting application for E2E tests..."
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          sleep 10

      - name: Run API E2E tests
        run: |
          python tests/api_e2e_test.py

      - name: Build Docker image
        run: |
          docker build -t opspilot-ai:ci .

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name opspilotaiacr01

      - name: Push Docker image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name opspilotaiacr01 \
            --query loginServer \
            --output tsv)

          docker tag opspilot-ai:ci \
            $ACR_LOGIN_SERVER/opspilot-ai:${GITHUB_SHA}

          docker push \
            $ACR_LOGIN_SERVER/opspilot-ai:${GITHUB_SHA}
